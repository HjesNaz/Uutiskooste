{"name":"Uutiskooste","on":{"schedule":[{"cron":"17 * * * *"}],"workflow_dispatch":{}},"permissions":{"contents":"write","pages":"write","id-token":"write"},"concurrency":{"group":"pages","cancel-in-progress":false},"jobs":{"rakenna":{"runs-on":"ubuntu-latest","environment":{"name":"github-pages","url":"${{ steps.julkaisu.outputs.page_url || steps.julkaisu2.outputs.page_url || steps.julkaisu3.outputs.page_url }}"},"steps":[{"uses":"actions/checkout@v5"},{"uses":"actions/setup-python@v6","with":{"python-version":"3.12"}},{"name":"Tee kooste","env":{"GEMINI_API_KEY":"${{ secrets.GEMINI_API_KEY }}","NTFY_TOPIC":"${{ secrets.NTFY_TOPIC }}"},"run":"python uutiskooste.py --ulos site/index.html --arkisto arkisto --ei-avausta ${{ github.event_name == 'workflow_dispatch' && '--pakota' || '' }}"},{"name":"Tallenna arkisto","run":"git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add arkisto && (git diff --cached --quiet || (git commit -m 'Arkisto [skip ci]' && git pull --rebase && git push))"},{"uses":"actions/upload-pages-artifact@v5","with":{"path":"site"}},{"id":"julkaisu","uses":"actions/deploy-pages@v5","continue-on-error":true},{"name":"Odota ja yritä uudelleen","if":"steps.julkaisu.outcome == 'failure'","run":"sleep 60"},{"id":"julkaisu2","if":"steps.julkaisu.outcome == 'failure'","uses":"actions/deploy-pages@v5","continue-on-error":true},{"name":"Odota ja yritä vielä kerran","if":"steps.julkaisu2.outcome == 'failure'","run":"sleep 180"},{"id":"julkaisu3","if":"steps.julkaisu2.outcome == 'failure'","uses":"actions/deploy-pages@v5"}]}}}
